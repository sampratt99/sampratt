    <h1>Sam Pratt</h1>

    <p>Email: <a href="mailto:sampratt@g.ucla.edu">sampratt@g.ucla.edu</a> · <a href="https://scholar.google.com/citations?user=dvaHcYoAAAAJ&amp;hl=en">Google Scholar</a> · <a href="https://sampratt.substack.com/">Newsletter</a> · <a href="assets/Pratt-CV.pdf">CV (PDF)</a></p>
